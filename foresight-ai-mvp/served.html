<script>

async function askAI() {

    const question =
        document.getElementById("question").value;

    const response = await fetch(
        "/copilot/ask",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        }
    );

    const data = await response.json();

    document.getElementById(
        "ai-response"
    ).innerText = data.answer;
}

</script>
